[project]
name = "retailai"
version = "0.0.0"
description = "RetailAI: Multi-Agent Sales Intelligence (CrewAI, M5 forecasting)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "crewai",
    "pandas",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "streamlit",
    "joblib",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    # deprecations raised inside CrewAI itself, not by project code
    "ignore::DeprecationWarning:crewai.*",
]

[tool.ruff]
line-length = 100
target-version = "py312"
